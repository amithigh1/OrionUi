<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Orion Admin</title>
<script src="../dist/orion.js"></script>
<style>
  body { margin: 0; display: grid; place-items: center; min-height: 100vh; padding: 2rem 1rem;
    background: radial-gradient(800px 360px at 50% -10%, var(--o-primary-subtle), transparent 70%), var(--o-bg); }
  .fp { width: 100%; max-width: 24rem; text-align: center; }
</style>
</head>
<body>
<div class="fp">
  <div class="o-empty-icon o-mx-auto o-c-primary" style="color:var(--o-primary-text);background:var(--o-primary-subtle)"><o-icon name="key"></o-icon></div>
  <h1 class="o-h4 o-mb-1">Forgot your password?</h1>
  <p class="o-text-muted">Enter the email you signed up with and we will send you a reset link.</p>

  <form id="fp" class="o-mt-5 o-text-start" data-o-validate novalidate>
    <div class="o-field">
      <label class="o-label is-required" for="fp-email">Email</label>
      <div class="o-input-wrap"><o-icon name="mail"></o-icon>
        <input class="o-input" id="fp-email" name="email" type="email" autocomplete="email" placeholder="you@company.com" data-o-rules="required|email"></div>
      <div class="o-error"></div>
    </div>
    <button class="o-btn o-btn-primary o-btn-block o-btn-lg" type="submit">Send reset link</button>
  </form>

  <div id="fp-done" hidden>
    <div class="o-alert o-alert-success o-text-start o-mt-5"><o-icon name="check-circle"></o-icon>
      <div class="o-alert-content"><div class="o-alert-title">Check your inbox</div>
        We sent a reset link to <b id="fp-sent"></b>. The link expires in 30 minutes.</div></div>
    <button class="o-btn o-btn-ghost o-mt-2" id="fp-resend">Resend email <span id="fp-count" class="o-text-muted"></span></button>
  </div>

  <p class="o-mt-6 o-mb-0"><a href="login.html"><o-icon name="arrow-left"></o-icon> Back to sign in</a></p>
</div>

<script>
  const form = document.getElementById('fp'), done = document.getElementById('fp-done');
  const v = Orion.validate ? Orion.validate(form) : null;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (v && !(await v.validate())) return;
    const btn = form.querySelector('button');
    btn.classList.add('is-loading');
    setTimeout(() => {
      btn.classList.remove('is-loading');
      document.getElementById('fp-sent').textContent = form.email.value;
      form.hidden = true; done.hidden = false;
      startCountdown();
    }, 700);
  });
  function startCountdown() {
    const btn = document.getElementById('fp-resend'), out = document.getElementById('fp-count');
    let left = 30; btn.disabled = true;
    const tick = () => { out.textContent = left ? `(${left}s)` : ''; if (!left--) { btn.disabled = false; clearInterval(id); } };
    const id = setInterval(tick, 1000); tick();
  }
  document.getElementById('fp-resend').addEventListener('click', () => { Orion.toast?.('Reset link sent again'); startCountdown(); });
</script>
</body>
</html>
