<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team chat — Orion Admin</title>
<script src="../dist/orion.js"></script>
<link rel="stylesheet" href="assets/shell.css">
<style>
  .ch { display: grid; grid-template-columns: 1fr; border: 1px solid var(--o-border); border-radius: var(--o-radius-lg);
    background: var(--o-bg-elevated); overflow: hidden; height: min(calc(100vh - 13rem), 46rem); min-height: 26rem; }
  @media (min-width: 768px)  { .ch { grid-template-columns: 17rem 1fr; } }
  @media (min-width: 1280px) { .ch { grid-template-columns: 17rem 1fr 16rem; } }

  .ch-rail { display: flex; flex-direction: column; min-height: 0; border-inline-end: 1px solid var(--o-border); background: var(--o-bg-subtle); }
  .ch-rail-head { padding: .75rem; border-block-end: 1px solid var(--o-border); }
  .ch-convos { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; }
  .ch-convo { display: flex; gap: .625rem; width: 100%; padding: .625rem .75rem; border: 0; background: none; align-items: center;
    text-align: start; cursor: pointer; border-block-end: 1px solid var(--o-border); color: inherit; font: inherit; }
  .ch-convo:hover { background: var(--o-bg-hover, var(--o-bg-subtle)); }
  .ch-convo.is-active { background: var(--o-primary-subtle); box-shadow: inset 3px 0 0 var(--o-primary); }
  .ch-convo-body { flex: 1; min-width: 0; overflow: hidden; }
  .ch-convo-top { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
  .ch-convo-name { min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-convo-last { color: var(--o-text-muted); font-size: var(--o-fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ch-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .ch-head { display: flex; gap: .75rem; align-items: center; padding: .75rem 1rem; border-block-end: 1px solid var(--o-border); }
  .ch-log { flex: 1; min-height: 0; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
  .ch-day { align-self: center; font-size: var(--o-fs-xs); color: var(--o-text-muted);
    background: var(--o-bg-subtle); border: 1px solid var(--o-border); border-radius: 999px; padding: .125rem .625rem; }
  .ch-msg { display: flex; gap: .625rem; max-width: min(42rem, 88%); }
  .ch-msg.is-me { margin-inline-start: auto; flex-direction: row-reverse; }
  .ch-bubble { padding: .5rem .75rem; border-radius: 14px; background: var(--o-bg-subtle); border: 1px solid var(--o-border); overflow-wrap: anywhere; }
  .ch-msg.is-me .ch-bubble { background: var(--o-primary); border-color: var(--o-primary); color: var(--o-primary-contrast, #fff); }
  .ch-meta { font-size: var(--o-fs-xs); color: var(--o-text-muted); margin-top: .25rem; display: flex; gap: .375rem; align-items: center; }
  .ch-msg.is-me .ch-meta { justify-content: flex-end; }
  .ch-attach { display: flex; gap: .5rem; align-items: center; margin-top: .375rem; padding: .375rem .5rem; color: var(--o-text);
    border: 1px solid var(--o-border); border-radius: var(--o-radius-sm); background: var(--o-bg-elevated); font-size: var(--o-fs-sm); }
  .ch-reacts { display: flex; gap: .25rem; margin-top: .25rem; }
  .ch-react { font-size: var(--o-fs-xs); padding: 0 .375rem; border-radius: 999px; border: 1px solid var(--o-border); background: var(--o-bg-elevated); color: var(--o-text); cursor: pointer; }
  .ch-typing { padding: 0 1rem .25rem; font-size: var(--o-fs-xs); color: var(--o-text-muted); min-height: 1.25rem; }
  .ch-compose { border-block-start: 1px solid var(--o-border); padding: .75rem; display: flex; gap: .5rem; align-items: flex-end; }
  .ch-compose textarea { flex: 1; resize: none; max-height: 8rem; }
  .ch-info { border-inline-start: 1px solid var(--o-border); overflow-y: auto; padding: 1rem; background: var(--o-bg-subtle); }
  @media (max-width: 1279px) { .ch-info { display: none; } }
  @media (max-width: 767px) { .ch-rail { display: none; } .ch-rail.is-open { display: flex; } }
</style>
<script>
  window.PAGE = {
    id: 'chat', title: 'Team chat', subtitle: 'Conversations, presence and files',
    breadcrumbs: [{ label: 'Home', href: 'dashboard.html' }, { label: 'Workspace' }, { label: 'Chat' }],
    actions: '<button class="o-btn" id="ch-new"><o-icon name="message-square"></o-icon>New message</button>',
  };
</script>
<script src="assets/shell.js" defer></script>
</head>
<body>
<div id="app-content">
  <div class="ch">
    <!-- Conversation rail -->
    <aside class="ch-rail" id="ch-rail">
      <div class="ch-rail-head">
        <div class="o-input-wrap"><o-icon name="search"></o-icon>
          <input class="o-input o-input-sm" id="ch-filter" type="search" placeholder="Search conversations" aria-label="Search conversations"></div>
      </div>
      <div class="ch-convos" id="ch-convos" role="tablist" aria-label="Conversations" aria-orientation="vertical"></div>
    </aside>

    <!-- Thread -->
    <section class="ch-main">
      <header class="ch-head">
        <button class="o-btn o-btn-icon o-btn-ghost o-d-md-none" type="button" id="ch-back" aria-label="Conversations"><o-icon name="menu"></o-icon></button>
        <o-avatar id="ch-av" size="sm"></o-avatar>
        <div class="o-flex-1" style="min-width:0">
          <b id="ch-title">—</b>
          <div class="o-text-muted o-text-xs" id="ch-sub">—</div>
        </div>
        <button class="o-btn o-btn-icon o-btn-ghost" type="button" id="ch-call" aria-label="Start a call"><o-icon name="phone"></o-icon></button>
        <o-dropdown placement="bottom-end" id="ch-menu">
          <button class="o-btn o-btn-icon o-btn-ghost" type="button" aria-label="Conversation menu"><o-icon name="more-vertical"></o-icon></button>
          <div class="o-dropdown-menu">
            <button class="o-dropdown-item" type="button" data-value="pin"><o-icon name="bookmark"></o-icon> Pin conversation</button>
            <button class="o-dropdown-item" type="button" data-value="mute"><o-icon name="bell-off"></o-icon> Mute notifications</button>
            <button class="o-dropdown-item" type="button" data-value="export"><o-icon name="download"></o-icon> Export transcript</button>
            <div class="o-dropdown-divider"></div>
            <button class="o-dropdown-item is-danger" type="button" data-value="leave"><o-icon name="log-out"></o-icon> Leave conversation</button>
          </div>
        </o-dropdown>
      </header>

      <div class="ch-log" id="ch-log" tabindex="0" aria-live="polite" aria-label="Messages"></div>
      <div class="ch-typing" id="ch-typing"></div>

      <form class="ch-compose" id="ch-form">
        <button class="o-btn o-btn-icon o-btn-ghost" type="button" id="ch-attach" aria-label="Attach a file"><o-icon name="paperclip"></o-icon></button>
        <textarea class="o-textarea" id="ch-input" rows="1" placeholder="Write a message — @ to mention, Enter to send" data-o-autosize aria-label="Message"></textarea>
        <button class="o-btn o-btn-icon o-btn-ghost" type="button" id="ch-emoji" aria-label="Insert emoji"><o-icon name="smile"></o-icon></button>
        <button class="o-btn o-btn-primary o-btn-icon" type="submit" aria-label="Send message"><o-icon name="send"></o-icon></button>
      </form>
    </section>

    <!-- Details -->
    <aside class="ch-info">
      <div class="o-text-center o-mb-4">
        <o-avatar id="ch-info-av" size="xl" class="o-mx-auto"></o-avatar>
        <b class="o-d-block o-mt-2" id="ch-info-name">—</b>
        <div class="o-text-muted o-text-sm" id="ch-info-role">—</div>
      </div>
      <div class="o-cluster o-justify-center o-mb-4">
        <button class="o-btn o-btn-sm" type="button"><o-icon name="video"></o-icon>Meet</button>
        <button class="o-btn o-btn-sm" type="button"><o-icon name="mail"></o-icon>Email</button>
      </div>
      <p class="o-eyebrow o-mb-2">Members</p>
      <div class="o-list o-list-flush o-list-compact o-mb-4" id="ch-members"></div>
      <p class="o-eyebrow o-mb-2">Shared files</p>
      <div class="o-list o-list-flush o-list-compact" id="ch-files"></div>
    </aside>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const O = Orion, esc = O.util.esc, now = Date.now(), M = 60e3, H = 3600e3, D = 864e5;
  const ME = 'Ananya Patel';

  const PEOPLE = {
    'Daniel Okafor': { role: 'Engineering manager', status: 'online' },
    'Sofia Marin':   { role: 'Product designer', status: 'away' },
    'Kenji Tanaka':  { role: 'Support lead', status: 'online' },
    'Priya Nair':    { role: 'Data analyst', status: 'offline' },
    'Ananya Patel':  { role: 'Head of Operations', status: 'online' },
  };

  const CONVOS = [
    { id: 'ops', name: '# operations', kind: 'channel', members: ['Daniel Okafor', 'Sofia Marin', 'Kenji Tanaka', 'Priya Nair', ME], unread: 3,
      messages: [
        { from: 'Kenji Tanaka', at: now - 2 * D - 3 * H, text: 'Morning all — the fulfilment backlog is down to 42 orders.' },
        { from: 'Daniel Okafor', at: now - 2 * D - 2.5 * H, text: 'Nice. Is the Penang warehouse still the bottleneck?' },
        { from: ME, at: now - 2 * D - 2 * H, text: 'It is, but the second picking shift starts Monday. I put the plan in **headcount-plan.xlsx**.',
          attach: { name: 'headcount-plan.xlsx', size: 182e3 } },
        { from: 'Sofia Marin', at: now - 26 * H, text: 'Shipped the new status timeline in the order drawer — screenshots in the design channel.', reacts: { '🎉': 3, '👀': 1 } },
        { from: 'Priya Nair', at: now - 5 * H, text: 'Weekly export is ready: revenue up 8.4% WoW, refunds flat.' },
        { from: 'Kenji Tanaka', at: now - 42 * M, text: 'Can someone approve the refund for Globex? It is over my limit.' },
        { from: 'Daniel Okafor', at: now - 12 * M, text: '@Ananya Patel this one is yours I think 🙏' },
      ] },
    { id: 'daniel', name: 'Daniel Okafor', kind: 'dm', members: ['Daniel Okafor', ME], unread: 0,
      messages: [
        { from: 'Daniel Okafor', at: now - 4 * H, text: 'Do you have 15 minutes before standup?' },
        { from: ME, at: now - 3.8 * H, text: 'Yes — 09:45 works.' },
        { from: 'Daniel Okafor', at: now - 3.7 * H, text: 'Perfect, sending an invite.', reacts: { '👍': 1 } },
      ] },
    { id: 'sofia', name: 'Sofia Marin', kind: 'dm', members: ['Sofia Marin', ME], unread: 1,
      messages: [
        { from: 'Sofia Marin', at: now - 20 * H, text: 'Quick one: should the empty state for Reports use the illustration or the icon?' },
        { from: ME, at: now - 19 * H, text: 'Icon — the illustration competes with the charts.' },
        { from: 'Sofia Marin', at: now - 31 * M, text: 'Agreed. Updated the spec.' },
      ] },
    { id: 'support', name: '# support-escalations', kind: 'channel', members: ['Kenji Tanaka', 'Priya Nair', ME], unread: 0,
      messages: [
        { from: 'Kenji Tanaka', at: now - 3 * D, text: 'Escalation SLA is now 4 hours for enterprise accounts.' },
        { from: ME, at: now - 3 * D + H, text: 'Noted — I updated the runbook.' },
      ] },
    { id: 'priya', name: 'Priya Nair', kind: 'dm', members: ['Priya Nair', ME], unread: 0,
      messages: [{ from: 'Priya Nair', at: now - 6 * D, text: 'Cohort dashboard is live 📊' }] },
  ];

  const FILES = [['Q3-board-pack.pdf', 4.2e6, 'file-text'], ['headcount-plan.xlsx', 182e3, 'table'],
    ['team-photo.jpg', 2.6e6, 'image'], ['promo.mp4', 18.2e6, 'video']];

  let active = CONVOS[0], filter = '';
  const plain = t => t.replace(/\*\*(.+?)\*\*/g, '$1');
  const lastOf = c => c.messages[c.messages.length - 1];
  // Compact "12m" / "4h" / "3d" stamps for the narrow rail; full relative wording is used in the thread.
  const ago = at => { const s = (Date.now() - at) / 1000; return s < 60 ? 'now' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd'; };
  const statusLabel = s => s === 'online' ? 'Active now' : s === 'away' ? 'Away' : 'Offline';

  // ---- Rail ----
  const rail = document.getElementById('ch-convos');
  function paintRail() {
    const list = CONVOS.filter(c => !filter || c.name.toLowerCase().includes(filter));
    rail.innerHTML = list.map(c => {
      const last = lastOf(c), person = c.kind === 'dm' ? PEOPLE[c.name] : null;
      return `<button class="ch-convo ${c === active ? 'is-active' : ''}" type="button" role="tab" aria-selected="${c === active}" data-id="${c.id}">
        ${c.kind === 'dm'
          ? `<o-avatar size="sm" name="${esc(c.name)}" status="${person.status}"></o-avatar>`
          : `<o-avatar size="sm" shape="square" icon="hash" color="primary" name="${esc(c.name)}"></o-avatar>`}
        <span class="ch-convo-body">
          <span class="ch-convo-top"><span class="ch-convo-name">${esc(c.name)}</span>
            <small class="o-text-muted">${ago(last.at)}</small></span>
          <span class="ch-convo-last">${last.from === ME ? 'You: ' : c.kind === 'channel' ? last.from.split(' ')[0] + ': ' : ''}${esc(plain(last.text))}</span>
        </span>
        ${c.unread ? `<span class="o-badge o-badge-primary o-badge-sm">${c.unread}</span>` : ''}
      </button>`;
    }).join('');
  }
  rail.addEventListener('click', e => {
    const btn = e.target.closest('.ch-convo'); if (!btn) return;
    active = CONVOS.find(c => c.id === btn.dataset.id);
    active.unread = 0;
    document.getElementById('ch-rail').classList.remove('is-open');
    paintRail(); paintThread();
  });
  document.getElementById('ch-filter').addEventListener('input', e => { filter = e.target.value.trim().toLowerCase(); paintRail(); });
  document.getElementById('ch-back').addEventListener('click', () => document.getElementById('ch-rail').classList.toggle('is-open'));

  // ---- Thread ----
  const log = document.getElementById('ch-log');
  const rich = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/@([A-Z][a-z]+ [A-Z][a-z]+)/g, '<span class="o-mention">@$1</span>');
  const dayLabel = (at, fallback) => {
    const d0 = new Date().setHours(0, 0, 0, 0);
    return at >= d0 ? 'Today' : at >= d0 - D ? 'Yesterday' : fallback;
  };

  function paintThread() {
    const person = active.kind === 'dm' ? PEOPLE[active.name] : null;
    document.getElementById('ch-title').textContent = active.name;
    document.getElementById('ch-sub').textContent = person
      ? `${person.role} · ${statusLabel(person.status)}`
      : `${active.members.length} members · ${active.messages.length} messages`;
    for (const id of ['ch-av', 'ch-info-av']) {
      const av = document.getElementById(id);
      av.name = active.name;
      if (person) { av.status = person.status; av.icon = ''; av.shape = ''; av.color = ''; }
      else { av.status = ''; av.icon = 'hash'; av.shape = 'square'; av.color = 'primary'; }
    }
    document.getElementById('ch-info-name').textContent = active.name;
    document.getElementById('ch-info-role').textContent = person?.role || 'Channel';
    document.getElementById('ch-members').innerHTML = active.members.map(n => `
      <div class="o-list-item"><o-avatar size="xs" name="${esc(n)}" status="${PEOPLE[n].status}"></o-avatar>
        <div class="o-list-content"><div class="o-list-title">${n === ME ? 'You' : esc(n)}</div><div class="o-list-meta">${PEOPLE[n].role}</div></div></div>`).join('');
    document.getElementById('ch-files').innerHTML = FILES.map(([name, size, icon]) => `
      <div class="o-list-item"><o-icon name="${icon}"></o-icon>
        <div class="o-list-content"><div class="o-list-title o-truncate">${name}</div><div class="o-list-meta">${O.format.bytes(size)}</div></div></div>`).join('');

    let lastDay = '';
    log.innerHTML = active.messages.map(m => {
      const day = O.format.date(new Date(m.at), 'medium');
      const header = day !== lastDay ? `<div class="ch-day">${dayLabel(m.at, day)}</div>` : '';
      lastDay = day;
      const me = m.from === ME;
      return header + `
        <div class="ch-msg ${me ? 'is-me' : ''}">
          ${me ? '' : `<o-avatar size="sm" name="${esc(m.from)}"></o-avatar>`}
          <div>
            <div class="ch-bubble">${rich(m.text)}
              ${m.attach ? `<div class="ch-attach"><o-icon name="paperclip"></o-icon><span>${m.attach.name}</span>
                <small class="o-text-muted">${O.format.bytes(m.attach.size)}</small></div>` : ''}</div>
            ${m.reacts ? `<div class="ch-reacts">${Object.entries(m.reacts).map(([e, n]) =>
              `<button class="ch-react" type="button" aria-label="React ${e}">${e} ${n}</button>`).join('')}</div>` : ''}
            <div class="ch-meta">${me ? '' : `<b>${m.from.split(' ')[0]}</b>`}
              <span>${O.format.time(new Date(m.at))}</span>
              ${me ? `<o-icon name="check-check" class="o-text-primary" title="Read"></o-icon>` : ''}</div>
          </div>
        </div>`;
    }).join('');
    log.scrollTop = log.scrollHeight;
  }

  log.addEventListener('click', e => {
    const r = e.target.closest('.ch-react'); if (!r) return;
    const [emoji, n] = r.textContent.trim().split(' ');
    r.textContent = `${emoji} ${+n + 1}`;
  });

  // ---- Compose: @mentions, emoji picker, Enter to send ----
  const input = document.getElementById('ch-input');
  const people = Object.keys(PEOPLE).filter(n => n !== ME).map(n => ({ id: n, label: n, value: n, description: PEOPLE[n].role }));
  O.mentions(input, { source: q => people.filter(p => p.label.toLowerCase().includes(q.toLowerCase())) });

  document.getElementById('ch-emoji').addEventListener('click', e => {
    O.mentions.emoji.picker(e.currentTarget, { onSelect: char => {
      const { selectionStart: s, selectionEnd: en, value } = input;
      input.value = value.slice(0, s) + char + value.slice(en);
      input.selectionStart = input.selectionEnd = s + char.length;
      input.focus(); input.dispatchEvent(new Event('input', { bubbles: true }));
    } });
  });

  document.getElementById('ch-form').addEventListener('submit', e => { e.preventDefault(); send(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !e.defaultPrevented) { e.preventDefault(); send(); }
  });

  function send() {
    const text = input.value.trim(); if (!text) return;
    active.messages.push({ from: ME, at: Date.now(), text });
    input.value = ''; input.dispatchEvent(new Event('input', { bubbles: true }));
    paintRail(); paintThread();
    reply();
  }

  const typing = document.getElementById('ch-typing');
  function reply() {
    const other = active.members.find(n => n !== ME); if (!other) return;
    typing.textContent = `${other.split(' ')[0]} is typing…`;
    setTimeout(() => {
      typing.textContent = '';
      active.messages.push({ from: other, at: Date.now(),
        text: ['Got it — on it.', 'Thanks, that unblocks me.', 'Makes sense 👍', 'Can you share the link?'][Math.floor(Math.random() * 4)] });
      paintRail(); paintThread();
    }, 1400 + Math.random() * 900);
  }

  document.getElementById('ch-attach').addEventListener('click', () => O.toast('File picker opens here in a real app'));
  document.getElementById('ch-call').addEventListener('click', () => O.toast(`Calling ${active.name}…`));
  document.getElementById('ch-new').addEventListener('click', async () => {
    const who = await O.prompt({ title: 'New message', label: 'To', placeholder: 'Name or channel', required: true });
    if (who) O.toast.success(`Draft started with ${who}`);
  });
  document.getElementById('ch-menu').addEventListener('o-select', e => {
    const action = e.detail.value;
    if (action === 'export') {
      return O.export.csv(active.messages.map(m => ({ from: m.from, at: new Date(m.at).toISOString(), text: plain(m.text) })),
        { filename: `${active.id}-transcript.csv` });
    }
    O.toast({ pin: 'Conversation pinned', mute: 'Notifications muted', leave: 'You left the conversation' }[action] || action);
  });

  paintRail(); paintThread();
});
</script>
</body>
</html>
