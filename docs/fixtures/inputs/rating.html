<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rating fixture — Orion Admin</title>
<script src="../../../dist/orion.js"></script>
</head>
<body class="o-container o-py-6">
<form id="f" class="o-stack" style="max-width:28rem;gap:1.5rem;display:flex;flex-direction:column">
  <o-rating id="r1" name="score" value="3" max="5"></o-rating>
  <o-rating id="r2" name="score2" value="3.5" precision="0.5" max="5"></o-rating>
  <o-rating id="r3" icon="heart" color="danger" value="2" max="5"></o-rating>
  <o-rating id="r4" icon="thumb" color="success" value="1" max="1" clearable></o-rating>
  <o-rating id="r5" item-labels='["Terrible","Bad","Okay","Good","Great"]' value="0" max="5" clearable></o-rating>
  <o-rating id="r6" value="4" max="5" readonly></o-rating>
  <button class="o-btn" type="reset">Reset</button>
</form>
</body>
</html>
