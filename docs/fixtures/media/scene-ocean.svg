  <path d="M1180 722 l40 -18 h60 l30 18z" fill="#1c1917"/><path d="M1238 704 v-70 l34 62z" fill="#1c1917"/>
  <g fill="none" stroke="#1c1917" stroke-width="4" stroke-linecap="round" opacity=".7"><path d="M380 520 q12 -10 24 0 q12 -10 24 0"/><path d="M450 560 q9 -8 18 0 q9 -8 18 0"/></g>
