<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard smoke test</title>
<script src="../../../dist/orion.js"></script>
<style>body{padding:2rem;font-family:sans-serif} #dash{max-width:1100px}</style>
</head>
<body>
<button type="button" data-o-action="dashboard" data-o-value="edit" data-o-target="#dash">Toggle edit</button>
<button type="button" data-o-action="dashboard" data-o-value="catalog" data-o-target="#dash">Add widget</button>
<button type="button" data-o-action="dashboard" data-o-value="reset" data-o-target="#dash">Reset</button>
<o-dashboard id="dash" editable persist="smoke-test" columns="12" row-height="80" gap="16">
  <o-widget id="w1" heading="Revenue" icon="trending-up" x="0" y="0" w="4" h="2" removable refreshable collapsible>
    <div>Widget 1 content</div>
  </o-widget>
  <o-widget id="w2" heading="Orders" icon="package" x="4" y="0" w="4" h="2" removable refreshable>
    <div>Widget 2 content</div>
  </o-widget>
  <o-widget id="w3" heading="Chart" icon="bar-chart" x="8" y="0" w="4" h="4" removable fullscreen>
    <o-chart id="chart1" height="200"></o-chart>
  </o-widget>
  <o-widget id="w4" heading="Table" icon="layout-grid" x="0" y="2" w="8" h="4" removable>
    <div>Table widget content</div>
  </o-widget>
</o-dashboard>

<hr>
<o-stat-group id="statgroup">
  <o-stat label="Revenue" value="86123" format="currency" delta="8.4" period="vs last month" icon="dollar-sign" sparkline="[42,45,51,49,56,61,64,62,70,74,79,86]" countup></o-stat>
  <o-stat label="Active users" value="12045" compact delta="-3.2" delta-good="up" icon="users" color="success" goal="15000"></o-stat>
  <o-stat label="Conversion" value="4.8" format="percent" delta="1.1" delta-format="percent" icon="target" variant="card" goal-type="ring" goal="6"></o-stat>
  <o-stat label="Loading" loading></o-stat>
</o-stat-group>
<a href="#" id="linkstat-holder"></a>
<o-stat id="linkstat" label="Clickable" value="42" href="#test" variant="minimal"></o-stat>

<div id="countupwrap"><o-countup id="cu1" to="98765" duration="900"></o-countup></div>

<script>
document.getElementById('chart1').config = {
  type: 'line', labels: ['Jan','Feb','Mar','Apr','May','Jun'],
  series: [{ name: 'Revenue', data: [42,45,51,49,56,61] }],
};
document.getElementById('dash').catalog = [
  { type: 'kpi', title: 'KPI tile', icon: 'trending-up', description: 'A single statistic', w: 3, h: 2, renderer: (body) => { body.textContent = 'New KPI'; } },
  { type: 'notes', title: 'Notes', icon: 'file-text', description: 'Free-form text', w: 4, h: 3, renderer: (body) => { body.textContent = 'Notes widget'; } },
];
window.__ready = true;
</script>
</body>
</html>
