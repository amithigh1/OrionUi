<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locked — Orion Admin</title>
<script src="../../dist/orion.js"></script>
</head>
<body>
<div class="o-auth-split">
  <div class="o-auth-cover">
    <div class="o-auth-cover-brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
      Orion Admin
    </div>
    <div class="o-auth-cover-body">
      <div class="o-auth-illustration">
        <svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
          <defs><linearGradient id="cardGrad4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".97"/><stop offset="1" stop-color="#ffffff" stop-opacity=".82"/></linearGradient></defs>
          <rect x="100" y="30" width="280" height="300" rx="20" fill="url(#cardGrad4)"/>
          <rect x="140" y="60" width="200" height="130" rx="12" fill="#e0e7ff"/>
          <rect x="150" y="200" width="180" height="12" rx="6" fill="#c7d2fe"/>
          <rect x="150" y="222" width="130" height="10" rx="5" fill="#e0e7ff"/>
          <circle cx="240" cy="270" r="30" fill="#4338ca"/>
          <rect x="222" y="264" width="36" height="26" rx="6" fill="#fff"/>
          <path d="M228 264v-10a12 12 0 0 1 24 0v10" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
      <h2 class="o-auth-cover-title">Your session is protected.</h2>
      <p class="o-auth-cover-text">We locked the screen after a short period of inactivity to keep your data safe.</p>
    </div>
    <div class="o-auth-cover-quote">
      “Auto-lock plus 2FA is exactly what our compliance team asked for.”
      <b>— Diego Fuentes, Security Lead at Palisade</b>
    </div>
  </div>
  <div class="o-auth-split-form">
    <div class="o-auth-card">
      <o-auth-form type="lock" id="lock-form"></o-auth-form>
    </div>
  </div>
</div>
<script>
  const lockForm = document.getElementById('lock-form');
  lockForm.user = { name: 'Ada Lovelace', email: 'ada@example.com' };
  lockForm.onSubmit = async (data) => {
    await new Promise(r => setTimeout(r, 600));
    if (data.password !== 'password123') throw { field: 'password', message: 'Incorrect password. Try password123.' };
    alert('Unlocked! (demo)');
  };
  lockForm.addEventListener('o-switch-user', () => alert('Would sign out and return to the login screen.'));
</script>
</body>
</html>
