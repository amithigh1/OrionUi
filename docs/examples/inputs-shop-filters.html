<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop filters example — Orion Admin</title>
<script src="../../dist/orion.js"></script>
<style>
  .shop { display: grid; grid-template-columns: 16rem 1fr; gap: 1.5rem; padding: 1.5rem; max-width: 64rem; margin: 0 auto; align-items: start; }
  @media (max-width: 700px) { .shop { grid-template-columns: 1fr; } }
  .filter-group { margin-bottom: 1.5rem; }
  .filter-group h3 { font-size: var(--o-fs-sm); font-weight: 600; margin: 0 0 .75rem; }
  .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 1rem; }
  .product-swatch { width: 1.25rem; height: 1.25rem; border-radius: 50%; border: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .product-swatch.is-active { box-shadow: 0 0 0 2px var(--o-surface), 0 0 0 4px var(--o-primary); }
  .product-price { font-weight: 700; font-size: var(--o-fs-lg); }
</style>
</head>
<body>
<h1 class="o-mb-0" style="padding:1.5rem 1.5rem 0">Shop filters example</h1>
<div class="shop">
  <aside>
    <div class="filter-group">
      <h3>Price</h3>
      <o-range id="price" dual min="0" max="500" step="5" value-start="50" value-end="300" format="currency:USD"></o-range>
      <div class="o-d-flex o-justify-between o-text-sm o-text-muted o-mt-2"><span id="price-min"></span><span id="price-max"></span></div>
    </div>
    <div class="filter-group">
      <h3>Minimum rating</h3>
      <o-rating id="min-rating" value="0" max="5" color="warning" clearable></o-rating>
    </div>
    <div class="filter-group">
      <h3>Color</h3>
      <o-colorpicker id="color-filter" value="#4f46e5" swatches='["#4f46e5","#dc2626","#15803d","#f59e0b","#0e7490","#0f172a"]'></o-colorpicker>
    </div>
    <button class="o-btn o-btn-sm" id="reset-filters" type="button">Reset filters</button>
  </aside>
  <main>
    <div class="products" id="products"></div>
    <p class="o-text-muted o-text-sm o-mt-3" id="count"></p>
  </main>
</div>
<script>
  const PRODUCTS = [
    { name: 'Aurora Chair', price: 120, rating: 4.5, color: '#4f46e5' },
    { name: 'Solstice Lamp', price: 45, rating: 3.8, color: '#f59e0b' },
    { name: 'Meridian Desk', price: 340, rating: 4.9, color: '#0f172a' },
    { name: 'Ember Rug', price: 89, rating: 4.1, color: '#dc2626' },
    { name: 'Terra Planter', price: 22, rating: 3.2, color: '#15803d' },
    { name: 'Nimbus Shelf', price: 210, rating: 4.6, color: '#0e7490' },
    { name: 'Cobalt Stool', price: 65, rating: 4.0, color: '#4f46e5' },
    { name: 'Ochre Vase', price: 30, rating: 2.9, color: '#f59e0b' },
  ];
  const priceEl = document.getElementById('price');
  const ratingEl = document.getElementById('min-rating');
  const colorEl = document.getElementById('color-filter');
  const grid = document.getElementById('products');
  const countEl = document.getElementById('count');

  const nearColor = (a, b) => {
    const ca = Orion.color.parse(a), cb = Orion.color.parse(b);
    return Math.hypot(ca.r - cb.r, ca.g - cb.g, ca.b - cb.b) < 60;
  };
  function render() {
    const [lo, hi] = [priceEl.valueStart, priceEl.valueEnd];
    const minR = ratingEl.value || 0;
    const filtered = PRODUCTS.filter(p => p.price >= lo && p.price <= hi && p.rating >= minR && (minR === 0 || true) && nearColor(p.color, colorEl.value));
    countEl.textContent = `${filtered.length} of ${PRODUCTS.length} products`;
    grid.innerHTML = '';
    filtered.forEach(p => {
      const card = document.createElement('div');
      card.className = 'o-card';
      card.innerHTML = `
        <div class="o-card-body">
          <div class="o-d-flex o-justify-between o-items-start">
            <div>
              <div class="o-fw-semibold">${Orion.util.esc(p.name)}</div>
              <div class="product-price">${Orion.format.currency(p.price, 'USD')}</div>
            </div>
            <span class="o-dot" style="background:${p.color};width:1rem;height:1rem"></span>
          </div>
          <o-rating value="${p.rating}" precision="0.5" max="5" color="warning" size="sm" readonly class="o-mt-2"></o-rating>
        </div>`;
      grid.append(card);
    });
    document.getElementById('price-min').textContent = Orion.format.currency(lo, 'USD');
    document.getElementById('price-max').textContent = Orion.format.currency(hi, 'USD');
  }
  priceEl.addEventListener('o-change', render);
  ratingEl.addEventListener('o-change', render);
  colorEl.addEventListener('o-change', render);
  document.getElementById('reset-filters').addEventListener('click', () => {
    priceEl.setRange(0, 500);
    ratingEl.setValue(0);
    colorEl.setValue('#4f46e5');
    render();
  });
  render();
</script>
</body>
</html>
